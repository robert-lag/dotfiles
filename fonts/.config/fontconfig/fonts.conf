<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<alias binding="strong">
		<family>serif</family>
		<prefer>
            <family>Libertinus Serif</family>
			<family>Source Han Serif</family>
            <family>Joy Pixels</family> <!-- For emojis -->
            <family>Noto Color Emoji</family> <!-- For emojis -->
            <family>Hack Nerd Font</family> <!-- For Nerd Font icons -->
            <family>Noto Sans CJK</family> <!-- For Chinese, Japanese, Korean -->
		</prefer>
	</alias>
	<alias binding="strong">
		<family>sans-serif</family>
		<prefer>
            <family>Libertinus Sans</family>
			<family>Source Han Sans</family>
            <family>Joy Pixels</family> <!-- For emojis -->
            <family>Noto Color Emoji</family> <!-- For emojis -->
            <family>Hack Nerd Font</family> <!-- For Nerd Font icons -->
            <family>Noto Sans CJK</family> <!-- For Chinese, Japanese, Korean -->
		</prefer>
	</alias>
	<alias binding="strong">
		<family>sans</family>
		<prefer>
            <family>Libertinus Sans</family>
			<family>Source Han Sans</family>
            <family>Joy Pixels</family> <!-- For emojis -->
            <family>Noto Color Emoji</family> <!-- For emojis -->
            <family>Hack Nerd Font</family> <!-- For Nerd Font icons -->
            <family>Noto Sans CJK</family> <!-- For Chinese, Japanese, Korean -->
		</prefer>
	</alias>
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>Hack Nerd Font</family>
			<family>Noto Sans Mono</family>
            <family>Libertinus Mono</family>
		</prefer>
	</alias>
</fontconfig>
<!-- vim:ft=xml
-->
